# Flood Prediction System ZM -- production-style stack: PostgreSQL + API + web.
#
#   cp .env.production.example .env.production   # then fill in REAL secrets
#   docker compose --env-file .env.production up -d --build
#
# Secrets come from .env.production, which is gitignored. Nothing secret lives here.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # No published port: the database is reachable only from the compose network.

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production            # makes the app REFUSE default secrets at boot
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      NASA_POWER_BASE_URL: https://power.larc.nasa.gov/api/temporal
      MODEL_ARTIFACT_DIR: ./ml_artifacts
    # Not published: only the web container reaches it.
    expose:
      - "8000"

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  pgdata:
